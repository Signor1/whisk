name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; individual jobs opt in to anything more.
permissions:
  contents: read

jobs:
  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # No `with: version` here — `pnpm/action-setup@v6` reads the version
      # from the root `package.json`'s `packageManager` field, and passing
      # both is a hard error (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Build packages first so the example consumes their dist/, mirroring
      # how a downstream consumer installs Whisk from npm. Catches drift
      # between package source and the published artefact (missing exports,
      # type-only re-exports that don't survive the build, etc.).
      - name: Build
        run: pnpm build

      - name: Build example app
        run: pnpm --filter @strimz/whisk-example-nextjs-basic build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # No `with: version` here — `pnpm/action-setup@v6` reads the version
      # from the root `package.json`'s `packageManager` field, and passing
      # both is a hard error (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail only on high or critical advisories. Moderate/low are surfaced
      # via Dependabot security updates instead — they shouldn't block PRs.
      - name: Audit (high+)
        run: pnpm audit --audit-level=high
