name: Release

on:
  push:
    branches: [main]

# Only run one release at a time. A second push while the first is mid-publish
# would otherwise race with changesets' version bump commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version + publish via changesets
    runs-on: ubuntu-latest
    # Push events from forks don't carry the secrets needed to publish; skip
    # them to avoid a noisy red status on community PRs.
    if: github.repository_owner == 'Signor1'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Version is read from the root `package.json`'s `packageManager`
      # field. Passing `with: version` alongside `packageManager` is a
      # hard error in `pnpm/action-setup@v6` (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Either opens / updates a "Version Packages" PR, or — when that PR
      # has been merged — runs `pnpm release` which publishes new versions
      # to npm with provenance.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
