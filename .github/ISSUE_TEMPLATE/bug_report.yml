name: Bug report
description: Something's wrong with the widget, the engine, the docs, or an example.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. The more reproduction detail you give, the faster this lands.

        **Found a security vulnerability?** Don't open this issue. Use
        [private vulnerability reporting](https://github.com/Signor1/whisk/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/Signor1/whisk/blob/main/SECURITY.md) for what to include.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One short paragraph. The user-visible symptom, not the file you suspect.
      placeholder: Clicking "Review" once doesn't load the quote — I have to click it twice before the widget moves on.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: One click on "Review" should load the quote.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: |
        Be specific: chain pair, wallet, widget config, the exact inputs. A
        minimal sandbox or a branch of `examples/` is the gold standard.
      placeholder: |
        1. Connect MetaMask on Arc Testnet.
        2. Pick destination = Base Sepolia.
        3. Type `vitalik.eth`, amount `1.00`.
        4. Click "Review" — nothing happens.
        5. Click "Review" again — quote loads.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Paste from your `package.json`. App Kit and viem if you've pinned them.
      placeholder: "@usewhisk/react@0.0.2, @usewhisk/core@0.0.2, @circle-fin/app-kit@1.5.1"
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      multiple: true
      options:
        - Chrome (desktop)
        - Safari (desktop)
        - Firefox (desktop)
        - Mobile Safari (iOS)
        - Mobile Chrome (Android)
        - Next.js App Router
        - Next.js Pages Router
        - Vite / CRA
        - Other (describe in logs)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / network logs
      description: |
        Optional but very welcome. Console errors, failing network requests,
        App Kit logs. Redact addresses or tx hashes only if you must — they
        make repro much easier on our end.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through [private disclosure](https://github.com/Signor1/whisk/security/advisories/new)).
          required: true
