name: Feature request
description: Propose a new prop, hook, resolver, recipe, or capability.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. If you're not sure whether this fits Whisk's scope, open a
        [Discussion](https://github.com/Signor1/whisk/discussions) first — alignment is
        cheaper than a closed PR.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The constraint or use case that motivated the idea. Be concrete.
      placeholder: I'm shipping subscription payments and need to lock the recipient but let the user pick the source chain.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: Code sketches are great. Prop names, hook signatures, expected output.
      placeholder: |
        ```tsx
        <WhiskSend recipient="0x…" lockRecipient />
        ```
        or:
        ```ts
        const { state, actions } = useWhisk({ resolverChain: composeResolvers([lensResolver, ensResolver]) });
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try first? Why did it fall short?

  - type: textarea
    id: extras
    attributes:
      label: Anything else
      description: Links, screenshots, related issues.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I'm willing to help implement (time + direction permitting).
